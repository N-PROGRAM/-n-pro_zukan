<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>(n) ARCHIVE LIBRARY</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#3B4A45; --ink-soft:#7A8B84;
    --card:#FFFFFF;
    --mint:#79CDA9; --mint-soft:#DCF3E8;
    --sky:#7FBEE8; --sky-soft:#E3F2FC;
    --lemon:#F2CE5E; --lemon-soft:#FBF1D3;
    --peach:#F49FB4; --peach-soft:#FDE7ED;
    --line:#E3EEE8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:linear-gradient(180deg,#EDF9F2 0%,#F2F8FC 55%,#FDF8EE 100%);
    color:var(--ink); font-family:"Zen Kaku Gothic New",sans-serif;
    line-height:1.8; -webkit-font-smoothing:antialiased;
    padding:44px 16px 60px; min-height:100vh;
  }
  .lib { max-width:520px; margin:0 auto; }

  header { text-align:center; padding-bottom:30px; position:relative; }
  header .en { font-family:"Shippori Mincho",serif; font-size:10px; letter-spacing:.36em; color:var(--mint); }
  h1 { font-family:"Shippori Mincho",serif; font-size:24px; font-weight:600; letter-spacing:.14em; margin-top:6px; }
  header .sub { font-size:12px; color:var(--ink-soft); letter-spacing:.12em; margin-top:6px; }
  .sprig { display:block; margin:10px auto 0; }

  .shelf { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  a.tome {
    text-decoration:none; color:var(--ink); background:var(--card);
    border:1.5px solid var(--line); border-radius:18px;
    box-shadow:0 4px 18px rgba(121,205,169,.16);
    display:block; overflow:hidden; transition:transform .15s;
  }
  a.tome:active { transform:scale(.97); }
  .tome .cover { aspect-ratio:1; }
  .tome .cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .tome .label { padding:10px 12px 13px; }
  .tome .label b { font-family:"Shippori Mincho",serif; font-size:15px; font-weight:600; letter-spacing:.12em; display:block; }
  .tome .label small { font-size:11px; color:var(--ink-soft); letter-spacing:.04em; }
  .tome.empty {
    border:1.5px dashed #CBE5D8; background:rgba(255,255,255,.45);
    border-radius:18px; box-shadow:none; display:flex; align-items:center; justify-content:center;
    aspect-ratio:1/1.32;
  }
  .tome.empty span { font-family:"Shippori Mincho",serif; font-size:11px; color:#A9C6B8; letter-spacing:.12em; text-align:center; }

  .door {
    display:flex; align-items:center; gap:14px; margin-top:26px;
    background:var(--card); border:1.5px solid var(--line); border-radius:18px;
    padding:14px 16px; text-decoration:none; color:var(--ink);
    box-shadow:0 4px 18px rgba(127,190,232,.16);
  }
  .door .mark {
    flex-shrink:0; width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:"Shippori Mincho",serif; font-size:19px; font-weight:600;
  }
  .door b { font-family:"Shippori Mincho",serif; font-size:13.5px; letter-spacing:.1em; display:block; }
  .door small { font-size:11px; color:var(--ink-soft); }
  .door .arrow { color:var(--ink-soft); font-size:13px; }

  footer { text-align:center; padding-top:34px; font-family:"Shippori Mincho",serif; font-size:10.5px; letter-spacing:.28em; color:#9FB8AC; }
</style>
</head>
<body>
<div class="lib">
  <header>
    <div class="en">NANA'S COLLECTED ARCHIVES</div>
    <h1>(n) ARCHIVE LIBRARY</h1>
    <div class="sub">採取し、原理を抽出し、自分の言語に育てる場所</div>
    <!-- 手描き風の草花スプリグ -->
    <svg class="sprig" width="120" height="30" viewBox="0 0 120 30" fill="none" aria-hidden="true">
      <path d="M10 22 Q35 10 60 16 Q85 22 110 12" stroke="#9BD8BC" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <circle cx="34" cy="12.5" r="3.2" fill="#F49FB4"/>
      <circle cx="30.5" cy="9.5" r="3.2" fill="#F8BCCB"/>
      <circle cx="37.5" cy="9.5" r="3.2" fill="#F8BCCB"/>
      <circle cx="34" cy="6.8" r="3.2" fill="#F49FB4"/>
      <circle cx="34" cy="9.8" r="1.7" fill="#F2CE5E"/>
      <path d="M78 18 Q80 11 86 9 Q84 16 78 18 Z" fill="#A5DEC3"/>
      <path d="M96 14 Q99 8 104 7 Q102 13 96 14 Z" fill="#BFE8F5"/>
      <circle cx="60" cy="15.5" r="2" fill="#F2CE5E"/>
    </svg>
  </header>

  <div class="shelf">
    <a class="tome" href="mikaku.html">
      <div class="cover" style="background:linear-gradient(160deg,#FDF0F3,#FDF6E4);"><svg width="100%" height="100%" viewBox="0 0 100 100" aria-hidden="true">
          <!-- ターンテーブル台 -->
          <rect x="6" y="22" width="88" height="66" rx="9" fill="#FFFFFF" stroke="#F3D9C4" stroke-width="1.5"/>
          <!-- 回る盤(=一皿) -->
          <circle cx="42" cy="55" r="26" fill="#3B3540"/>
          <circle cx="42" cy="55" r="21" fill="none" stroke="#46404E" stroke-width="1"/>
          <circle cx="42" cy="55" r="17" fill="none" stroke="#46404E" stroke-width="1"/>
          <circle cx="42" cy="55" r="13" fill="none" stroke="#46404E" stroke-width="1"/>
          <!-- レーベル: 皿とフォークナイフ -->
          <circle cx="42" cy="55" r="9" fill="#F49FB4"/>
          <path d="M39 51 v8 M38 51 v3 M40 51 v3" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
          <path d="M45.5 51 v8 M45.5 51 q2 1.5 0 4" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
          <!-- トーンアーム -->
          <circle cx="82" cy="30" r="4.5" fill="#79CDA9"/>
          <path d="M82 30 L64 44" stroke="#5FA986" stroke-width="2.4" stroke-linecap="round"/>
          <rect x="60" y="43" width="7" height="4.5" rx="2" transform="rotate(-38 63 45)" fill="#5FA986"/>
          <!-- 湯気(音楽のように立ちのぼる) -->
          <path d="M30 20 q3 -5 0 -9 M40 18 q3 -5 0 -9 M50 20 q3 -5 0 -9" stroke="#BFE8F5" stroke-width="2" fill="none" stroke-linecap="round"/>
          <!-- 音符 -->
          <circle cx="63" cy="12" r="2.4" fill="#F2CE5E"/>
          <path d="M65 12 v-7 h4" stroke="#F2CE5E" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <!-- 控えのレシピカード束 -->
          <g transform="rotate(-8 16 84)">
            <rect x="8" y="76" width="15" height="18" rx="2.5" fill="#fff" stroke="#F49FB4" stroke-width="1.2"/>
            <circle cx="15.5" cy="83" r="3.4" fill="#FBD9A5"/>
          </g>
          <g transform="rotate(4 26 86)">
            <rect x="20" y="78" width="15" height="18" rx="2.5" fill="#fff" stroke="#8FC9EC" stroke-width="1.2"/>
            <circle cx="27.5" cy="85" r="3.4" fill="#C7E9C4"/>
          </g>
          <g transform="rotate(12 38 88)">
            <rect x="32" y="80" width="15" height="18" rx="2.5" fill="#fff" stroke="#79CDA9" stroke-width="1.2"/>
            <circle cx="39.5" cy="87" r="3.4" fill="#F6B8C4"/>
          </g>
        </svg></div>
      <div class="label"><b>レシピカード</b><small>料理の原理採取 ─ 標本2</small></div>
    </a>
    <a class="tome" href="skill.html">
      <div class="cover" style="background:linear-gradient(170deg,#EAF8EE,#C9EDD6);">
        <svg width="100%" height="100%" viewBox="0 0 100 100" aria-hidden="true">
          <!-- 竹2本(節つき) -->
          <rect x="14" y="8" width="8" height="92" rx="4" fill="#8FD6AC"/>
          <path d="M13 30 h10 M13 55 h10 M13 80 h10" stroke="#6DBE8F" stroke-width="2" stroke-linecap="round"/>
          <rect x="78" y="18" width="7" height="82" rx="3.5" fill="#A5DEBB"/>
          <path d="M77 42 h9 M77 66 h9 M77 88 h9" stroke="#7FCB9F" stroke-width="2" stroke-linecap="round"/>
          <!-- 笹の葉 -->
          <path d="M22 14 Q32 6 40 8 Q33 16 22 14 Z" fill="#7FCB9F"/>
          <path d="M78 24 Q68 15 60 17 Q67 25 78 24 Z" fill="#9BD8B4"/>
          <!-- タケノコ(生えたて) -->
          <path d="M50 92 Q42 74 50 56 Q58 74 50 92 Z" fill="#E8C795"/>
          <path d="M50 60 Q46 72 47 88 M50 60 Q54 72 53 88" stroke="#D3A96E" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M50 56 Q47 63 44 66 M50 56 Q53 63 56 66" stroke="#C79A5F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <!-- 地面 -->
          <path d="M32 93 Q50 89 68 93" stroke="#B7E3C8" stroke-width="3" stroke-linecap="round" fill="none"/>
          <!-- 勢い線 -->
          <path d="M39 50 l-4 -6 M50 44 l0 -7 M61 50 l4 -6" stroke="#F2CE5E" stroke-width="2.4" stroke-linecap="round"/>
          <!-- 効果音 ニョッキ! -->
          <text x="52" y="34" text-anchor="middle" font-family="'Zen Kaku Gothic New',sans-serif" font-size="10" font-weight="700" fill="#F49FB4" transform="rotate(-8 52 34)">ニョッキ!</text>
        </svg>
      </div>
      <div class="label"><b>スキル竹林図鑑</b><small>「できた!」が生える ─ 標本1</small></div>
    </a>
    <a class="tome" href="minna-no-cho/">
      <div class="cover" style="background:linear-gradient(160deg,#FBE9EF,#FDF3D9); display:flex; align-items:center; justify-content:center;">
        <span style="width:64px; height:64px; border:3px solid var(--peach); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Shippori Mincho',serif; font-size:30px; color:var(--peach); transform:rotate(-5deg); background:#fff;">帳</span>
      </div>
      <div class="label"><b>みんなの帳</b><small>参加者と書き込む記帳ページ</small></div>
    </a>
    <div class="tome empty"><span>次の図鑑<br>（軌跡・ワイン・…）</span></div>
  </div>

  <a class="door" href="manual.html">
    <span class="mark" style="background:var(--sky-soft); color:var(--sky);">扉</span>
    <span style="flex:1;">
      <b>GUIDE ─ GitHub公開マニュアル</b>
      <small>手順と落とし穴の記録（図鑑ではなく、書庫の運用手引き）</small>
    </span>
    <span class="arrow">→</span>
  </a>

  <footer>NANA'S ARCHIVE</footer>
</div>
</body>
</html>
